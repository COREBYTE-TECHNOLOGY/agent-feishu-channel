# agent-feishu-channel configuration file — COREBYTE hardened fork.
#
# Copy this file to ~/.agent-feishu-channel/config.toml and fill in the
# values for your Lark bot. Or set AGENT_FEISHU_CONFIG to point at a
# custom location. (Legacy alias CLAUDE_FEISHU_CONFIG is still honored.)
#
# `afc init` writes this file with mode 0600. Keep it that way — it holds
# app_secret.

# ─── Lark / Feishu app credentials ───────────────────────────────────
[feishu]
# Which API domain to use. This fork defaults to Lark international:
#   "lark"   — https://open.larksuite.com (default)
#   "feishu" — https://open.feishu.cn
domain = "lark"

# Get these from https://open.larksuite.com/app -> your app -> Credentials
app_id = "cli_xxxxxxxxxxxxxxxx"
app_secret = "xxxxxxxxxxxxxxxxxxxxxxxxxx"

# Optional: only needed if you enabled event encryption in the Feishu
# developer console.
encrypt_key = ""
verification_token = ""

# ─── Access control ──────────────────────────────────────────────────
# The bot has full shell/file access to your machine. Lock it down!
[access]
# List of open_id values allowed to talk to the bot. To find yours,
# temporarily set this to [] and unauthorized_behavior = "reject", then
# send a message to the bot. It will reply with your open_id.
allowed_open_ids = [
  "ou_your_open_id_here",
]
# "ignore" = silently drop unauthorized messages (recommended)
# "reject" = reply with an error (noisy; reveals bot exists)
unauthorized_behavior = "ignore"

# REQUIRED (COREBYTE hardening): chat allowlist. Messages and card clicks
# from any other chat_id are dropped before the open_id check, so even an
# allowed user cannot drive the bot from a chat that is not listed here.
# Find a chat_id in the bot logs (logging.level = "debug") or via the Lark
# API explorer. Must contain at least one entry.
allowed_chat_ids = [
  "oc_your_group_chat_id_here",
]

# COREBYTE 共享群模型：corebyte-hermes / corebyte-claude / corebyte-codex
# 三个 bot 同处 *一个* Lark 群，靠 @提及 路由。
#
# true（默认）= 群聊里只处理 @ 到本 bot 的消息：事件中
# message.mentions[].id.open_id 必须等于本 bot 自己的 open_id（启动时通过
# GET /open-apis/bot/v3/info 解析并缓存；解析失败则群聊消息一律丢弃，即
# fail closed）。单聊（chat_type = "p2p"）不受此开关影响。
#
# 另外：任何 sender_type 不是 "user" 的事件（Lark 用 "app" 表示机器人）
# 都会被丢弃，三个 bot 不会互相触发。
#
# ⚠️ 千万不要给这三个应用申请「获取群组中所有消息 / im:message.group_msg」
# 权限。没有该权限时，Lark 只会把 @ 到本 bot 的群消息推过来；一旦授予，
# 每个 bot 都能看到群里全部消息（包括另外两个 bot 的消息和它们的输出），
# 本开关就成了唯一防线，而权限本身也远超所需。
require_mention = true

# ─── Agent defaults ──────────────────────────────────────────────────
[agent]
# Which provider new sessions should use by default.
default_provider = "claude"

# Absolute path where new sessions should run (use ~ to expand to your
# home directory). This is the cwd every new session starts in until
# changed via /cd or /project.
default_cwd = "~/my-projects"

# COREBYTE hardening: when true (default), /cd may only target default_cwd
# or a directory inside it, and every [projects] alias must resolve inside
# default_cwd (checked at startup). /config set of any *default_cwd key is
# refused while locked.
locked_cwd = true

# Shared fallback permission mode for new sessions. Prefer setting provider-
# specific values under [claude] and [codex] when they differ. Options:
#   default            — tool calls post a permission card to the chat;
#                        only the user who sent the triggering message
#                        can click.
#   acceptEdits        — auto-approve file edits, prompt for shell
#                        via the permission card
#   plan               — plan mode, read-only
# `bypassPermissions` has been REMOVED in this fork: a config that still
# contains it fails validation, and Codex can never run with
# approvalPolicy = never / sandbox = danger-full-access.
default_permission_mode = "default"

# ─── Claude provider ─────────────────────────────────────────────────
[claude]
# Provider-specific permission mode for Claude sessions.
default_permission_mode = "default"

# Model id passed to the CLI's --model flag. Any model the local
# `claude` CLI accepts (e.g. "claude-opus-4-6", "claude-sonnet-4-6",
# or aliases like "opus" / "sonnet").
default_model = "claude-opus-4-6"

# Claude SDK effort. Options: low, medium, high, xhigh, max.
default_effort = "high"

# Claude permission-card timing. Time in seconds the card waits for a
# click before auto-denying; the warning reminder is posted before the
# hard deadline.
permission_timeout_seconds = 300
permission_warn_before_seconds = 60

# Path to the local Claude Code CLI binary. Leave as "claude" to resolve
# via $PATH, or set an absolute path if the binary lives outside PATH.
# Run `which claude` to find yours.
cli_path = "claude"

# ─── Codex provider ─────────────────────────────────────────────────
[codex]
# Provider-specific permission mode for Codex sessions.
default_permission_mode = "default"

# Model id passed to the Codex SDK.
default_model = "gpt-5.5"

# Codex reasoning effort. Options: minimal, low, medium, high, xhigh.
default_effort = "high"

cli_path = "codex"

# ─── Render / Feishu cards ───────────────────────────────────────────
[render]
# Max UTF-8 bytes of inline content (tool input params, tool output
# previews) shown in a card before we truncate and append
# "... (N more bytes omitted)".
inline_max_bytes = 2048

# If true, skip extended-thinking blocks entirely instead of sending
# them as 💭 messages.
hide_thinking = false

# If true, send a small "✅ 12.3s · 1.2k in / 3.4k out" tip after each
# turn. Disable if you find it noisy.
show_turn_stats = true

# ─── Persistence paths ───────────────────────────────────────────────
[persistence]
state_file = "~/.agent-feishu-channel/state.json"
# Directory for structured log files.
log_dir = "~/.agent-feishu-channel/logs"
# How many days to keep session records before cleanup. Sessions older
# than this are pruned on startup.
session_ttl_days = 30

# ─── Logging ─────────────────────────────────────────────────────────
[logging]
# trace | debug | info | warn | error
level = "info"

# ─── Runtime-settable keys ───────────────────────────────────────────
# The following keys can be changed at runtime via /config set:
#   render.hide_thinking, render.show_turn_stats, render.inline_max_bytes,
#   logging.level, agent.default_provider,
#   agent.permission_timeout_seconds, agent.permission_warn_before_seconds,
#   claude.default_model, claude.default_effort,
#   claude.permission_timeout_seconds, claude.permission_warn_before_seconds,
#   codex.default_model, codex.default_effort
# COREBYTE hardening: *_permission_mode keys are never settable at runtime;
# agent.default_cwd / claude.default_cwd are refused while locked_cwd = true.
# Use /config set <key> <value> --persist to write changes back to this file.

# ─── Project aliases ─────────────────────────────────────────────────
# Aliases for /project command — quickly switch cwd by name.
# With agent.locked_cwd = true every path here must live inside
# agent.default_cwd, otherwise startup fails.
# [projects]
# my-app = "~/projects/my-app"
# infra = "~/projects/infrastructure"

